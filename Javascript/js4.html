<html>
    <head>
        <script>
            var fruits=["Apple","Mango","Banana","Grapes"];
            console.log("Fruits are "+fruits);
            fruits.push("Orange"); //to add a element at End
            console.log("Fruits are "+fruits);
            fruits.unshift("Pineapple"); //to add a element at Start
            console.log("Fruits are "+fruits);
            fruits.shift(); //to remove a element at Start
            console.log("Fruits are "+fruits);
            //original array not modified
            var slicedFruits = fruits.slice(1,3); //to get a part of array from index 1 to 3 (not including 3)
            console.log("Fruits are "+slicedFruits);
              console.log("Fruits are "+fruits);
            fruits.splice(1,2); //to remove elements from index 1 to 2 2 elements removed////
            console.log("Fruits are "+fruits);
            fruits.splice(1,0,"Papaya","Guava"); //to add elements from index 1 to 2 2 elements added////
            console.log("Fruits are "+fruits);

            var n1= "10";
            var n2="20";
            var n3=n1+n2;
            console.log("n3 is "+n3); //1020
            var a1=parseInt("10"); //string to integer conversion
            var a2=parseInt("20");
            var a3=a1+a2;
            console.log("a3 is "+a3); //30


        </script>
